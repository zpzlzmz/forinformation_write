<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>화약류관리기사 실기</title>
  <meta name="theme-color" content="#0f1419" />
  <meta name="description" content="화약류관리기사 실기 필답형 기출·개념 드릴" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="img/icon/apple-touch-icon.png" />
  <link rel="icon" href="img/icon/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="화약류실기" />
  <!-- ?v= 는 릴리스 버전. 앱을 고칠 때 올리면 브라우저 캐시가 확실히 갱신된다. -->
  <link rel="stylesheet" href="styles.css?v=2" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <section id="screen-login" class="login-screen">
    <form id="login-form" class="login-card" autocomplete="on">
      <p class="eyebrow">국가기술자격</p>
      <h1>문제풀이 로그인</h1>
      <p class="hint">로그인 후 자격증·회차·해설을 볼 수 있습니다.</p>
      <label class="login-field">
        <span>아이디</span>
        <input id="login-id" name="username" type="text" required autocomplete="username" />
      </label>
      <label class="login-field">
        <span>비밀번호</span>
        <input id="login-pw" name="password" type="password" required autocomplete="current-password" />
      </label>
      <p id="login-error" class="login-error hidden">아이디 또는 비밀번호가 올바르지 않습니다.</p>
      <button type="submit" class="btn primary login-btn">로그인</button>
    </form>
  </section>

  <div class="app hidden" id="app-root">
    <header class="top">
      <div>
        <p class="eyebrow" id="top-eyebrow">국가기술자격</p>
        <h1 id="top-title">문제풀이</h1>
      </div>
      <div class="top-right">
        <p class="rule" id="top-rule">자격증을 선택하세요</p>
        <button type="button" class="btn ghost hidden" id="btn-install">앱으로 설치</button>
        <button type="button" class="btn ghost" id="btn-logout">로그아웃</button>
      </div>
    </header>

    <section id="screen-cert" class="screen">
      <h2>자격증 선택</h2>
      <p class="hint">공부할 자격증을 고르세요.</p>
      <div id="cert-list" class="exam-list"></div>
    </section>

    <section id="screen-type" class="screen hidden">
      <button type="button" class="link-back" data-back="cert">← 자격증 다시 선택</button>
      <h2 id="type-title">시험 유형 선택</h2>
      <p class="hint">필기와 실기는 문제 형식도 채점 방식도 다릅니다.</p>
      <div id="type-list" class="mode-grid"></div>
    </section>

    <section id="screen-home" class="screen hidden">
      <button type="button" class="link-back" data-back="type">← 시험 유형 다시 선택</button>
      <h2 id="home-title">회차 선택</h2>
      <p class="hint" id="home-hint"></p>
      <div id="exam-list" class="exam-list"></div>
      <p id="home-empty" class="empty hidden">아직 등록된 문제가 없습니다.</p>
    </section>

    <section id="screen-mode" class="screen hidden">
      <button type="button" class="link-back" data-back="home">← 회차 다시 선택</button>
      <h2 id="mode-title">과목 / 모드 선택</h2>
      <p class="hint">20문제씩 채점되며, 문항당 5점으로 과목 점수와 평균을 계산합니다.</p>
      <div class="mode-grid">
        <button type="button" class="card mode-card" data-mode="full">
          <span class="card-kicker">추천</span>
          <strong>전체 모의고사</strong>
          <span>5과목 · 100문항 · 제출 후 과목별 점수 + 평균</span>
        </button>
        <button type="button" class="card mode-card" data-mode="subjects">
          <strong>과목별 선택</strong>
          <span>원하는 20문제 단위만 풀기</span>
        </button>
      </div>
      <div id="subject-list" class="subject-list hidden"></div>
    </section>

    <section id="screen-quiz" class="screen hidden">
      <div class="quiz-bar">
        <button type="button" class="link-back" id="quiz-back">← 뒤로</button>
        <div class="quiz-meta">
          <strong id="quiz-title"></strong>
          <span id="quiz-progress"></span>
        </div>
      </div>
      <form id="quiz-form" class="quiz-form"></form>
      <div class="quiz-actions">
        <button type="button" class="btn" id="btn-reveal-all">전체 정답 보기</button>
        <button type="submit" form="quiz-form" class="btn primary" id="btn-submit">채점하기</button>
      </div>
    </section>

    <section id="screen-result" class="screen hidden">
      <button type="button" class="link-back" id="result-back">← 다시 풀기</button>
      <h2>채점 결과</h2>
      <div id="result-summary" class="result-summary"></div>
      <div id="result-subjects" class="result-subjects"></div>
      <div class="result-actions">
        <button type="button" class="btn primary" id="btn-review">틀린 문제 / 해설 보기</button>
        <button type="button" class="btn" id="btn-retry">같은 범위 다시 풀기</button>
        <button type="button" class="btn ghost" data-back="home">회차 선택으로</button>
      </div>
      <div id="review-list" class="review-list hidden"></div>
    </section>
  </div>

  <script src="data/catalog.js?v=2"></script>
  <script src="app.js?v=2"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
